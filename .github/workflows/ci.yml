name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk (macOS)
        run: |
          # macOS-latest runners ship with python.org Python 3.x, which includes
          # the system Tcl/Tk. We just verify the import works.
          ${{ matrix.python-version }} -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" || pip install -e .

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Verify CLI
        run: |
          python -m cpm22 --version
          python -m cpm22 --help
